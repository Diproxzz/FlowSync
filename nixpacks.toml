providers = ["node", "python"]

[phases.setup]
nixPkgs = ["nodejs_20", "python3", "python3Packages.pip"]

[phases.install]
cmds = [
  "npm ci",
  "python3 -m pip install pymupdf --break-system-packages || pip install pymupdf --break-system-packages || true"
]

[phases.build]
cmds = [
  "npx prisma generate",
  "npm run build"
]

[start]
cmd = "npx prisma db push --accept-data-loss && npx tsx scripts/sync-product-master.ts && npm run start"
