providers = ["node", "python"]

[variables]
PATH = "/root/.nix-profile/bin:/nix/var/nix/profiles/default/bin:$PATH"
PYTHON_BIN = "python3"

[phases.setup]
nixPkgs = ["nodejs_20", "python3", "python3Packages.pip", "python3Packages.pymupdf", "fontconfig", "dejavu_fonts", "freefont_ttf"]

[phases.install]
cmds = [
  "npm ci",
  "python3 -m pip install pymupdf --break-system-packages || pip install pymupdf --break-system-packages || true"
]

[phases.build]
cmds = [
  "npx prisma generate",
  "npm run build"
]

[start]
cmd = "npx prisma db push --accept-data-loss && npx tsx scripts/sync-product-master.ts && npm run start"
